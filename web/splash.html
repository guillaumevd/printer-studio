<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Printer Studio</title><link rel="stylesheet" href="/styles/splash.css"><script src="/scripts/splash.js" defer></script></head>
<body><main class="splash"><div class="topline"><span class="dot"></span> PRINTER STUDIO <span id="version"></span></div>
<div class="art"><div class="halo"></div><img src="/assets/printer-front.svg" alt="Printer illustration"></div>
<div class="eyebrow">YOUR PRINTER. YOUR WORKSPACE.</div><h1>Ready for what's next<span>.</span></h1>
<p id="message" role="status">Starting Printer Studio…</p><div class="track"><div id="progress" class="indeterminate"></div></div>
<div id="actions"><button id="install" hidden>Install update</button><button id="continue" class="secondary">Continue to app</button></div>
<small>Application updates keep your printer firmware unchanged.</small></main></body></html>
